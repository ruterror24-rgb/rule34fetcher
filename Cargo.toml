[package]
name = "rule34-fetcher"
version = "0.1.0"
edition = "2021"
description = "Поиск по тегам на rule34.xxx и скачивание оригиналов изображений и видео"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "gzip", "http2", "native-tls", "json"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
